<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-cover bg-fixed md:bg-scroll bg-center bg-no-repeat h-screen" >
    

<div class='border border-1 mx-16 p-5 my-5 rounded '>
    <h2 class="text-3xl font-bold text-center mb-6">Mentor Registration</h2>
    <div class='flex flex-col md:flex-row'>
        <div class='w-full md:w-1/2 mt-6 md:mt-0'>
            <img class='w-full h-full object-cover rounded-lg shadow-lg opacity-90' src="https://img.freepik.com/free-vector/internship-job-illustration_52683-50829.jpg" alt="Mentor Illustration" />
            <!-- <img class='w-full h-auto rounded-lg shadow-lg' src="https://img.freepik.com/free-vector/internship-job-illustration_52683-50829.jpg" alt="Mentor Illustration" /> -->
        </div>
     
        <div class='w-full md:w-1/2'>
            <form class='bg-white/30 backdrop-blur-md p-6 rounded-xl shadow-lg'>
          
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label htmlFor="first-name" class="block text-gray-700 font-medium mb-2">First Name</label>
                        <input
                            type="text"
                            id="first-name"
                            name="first-name"
                            placeholder="Enter your first name"
                            class="bg-transparent text-zinc-600 w-full px-4 py-2 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                        />
                    </div>
                    <div>
                        <label htmlFor="last-name" class="block text-gray-700 font-medium mb-2">Last Name</label>
                        <input
                            type="text"
                            id="last-name"
                            name="last-name"
                            placeholder="Enter your last name"
                            class="bg-transparent w-full px-4 py-2 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                        />
                    </div>
                </div>

                <div class="mt-4">
                    <label htmlFor="email" class="block text-gray-700 font-medium mb-2">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        class="bg-transparent w-full px-4 py-2 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                    />
                </div>

                <div class="mt-4">
                    <label htmlFor="password" class="block text-gray-700 font-medium mb-2">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        class="bg-transparent w-full px-4 py-2 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                    />
                </div>

                <div class="mt-6">
                    <label htmlFor="expertise" class="block text-gray-700 font-medium mb-2">Subject Expertise</label>
                    <input
                        type="text"
                        id="expertise"
                        name="expertise"
                        placeholder="e.g., Mathematics, Physics"
                        class="bg-transparent w-full px-4 py-2 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                    />
                </div>

                <div class="mt-4">
                    <label htmlFor="location" class="block text-gray-700 font-medium mb-2">Location</label>
                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Enter your location"
                        class="bg-transparent w-full px-4 py-2 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                    />
                </div>

                <div class="mt-4">
                    <label htmlFor="availability" class="block text-gray-700 font-medium mb-2">Availability</label>
                    <select
                        id="availability"
                        name="availability"
                        class="bg-transparent w-full px-4 py-2 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500">
                        <option value="" disabled selected>Select your availability</option>
                        <option value="weekdays">Weekdays</option>
                        <option value="weekends">Weekends</option>
                        <option value="flexible">Flexible</option>
                    </select>
                </div>

                <div class="mt-6">
                    <label htmlFor="profile-picture" class="block text-gray-700 font-medium mb-2">Profile Picture</label>
                    <input
                        type="file"
                        id="profile-picture"
                        name="profile-picture"
                        class="bg-transparent w-full px-4 py-2 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                    />
                </div>

                <div class="mt-4">
                    <label htmlFor="credentials" class="block text-gray-700 font-medium mb-2">Upload Credentials</label>
                    <input
                        type="file"
                        id="credentials"
                        name="credentials"
                        class="bg-transparent w-full px-4 py-2 border border-gray-500 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500"
                    />
                </div>

                <div class="mt-8">
                    <button
                        type="submit"
                        class="w-full bg-gradient-to-r from-purple-400 to-pink-500 text-white py-3 rounded-lg font-semibold hover:opacity-90 transition">
                        Register as Mentor
                    </button>
                </div>
            </form>
        </div>

      
       
    </div>
</div>
</body>
</html>
