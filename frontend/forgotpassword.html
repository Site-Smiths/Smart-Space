<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen bg-gradient-to-r from-blue-400 via-purple-500 to-pink-500 flex items-center justify-center">
  <div class="bg-white rounded-2xl shadow-lg p-8 w-96">
    <h2 class="text-2xl font-bold text-center mb-6">Forgot Password</h2>
    <p class="text-gray-500 text-center mb-6">
      Enter your registered email to reset your password.
    </p>
    <form action="#" method="POST">
      <div class="mb-4">
        <label for="email" class="block text-gray-700 font-medium mb-2">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email"
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-purple-500" />
      </div>
      <button type="submit" class="w-full bg-gradient-to-r from-purple-400 to-pink-500 text-white py-2 rounded-lg font-semibold hover:opacity-90 transition">
        Reset Password
      </button>
    </form>
    <div class="my-6 text-center text-gray-500">Or</div>

      <a href="#">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook" class="w-8 h-8">
      </a>
      
      <a href="#">
        <img src="https://upload.wikimedia.org/wikipedia/en/6/60/Twitter_Logo_as_of_2021.svg" alt="Twitter" class="w-8 h-8">
      </a>
   
      <a href="#">
        <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="w-8 h-8">
      </a>
    </div> -->
    <div class="text-center text-gray-500">
      Remembered your password? <a href="#" class="text-purple-500 hover:underline">Login</a>
    </div>
  </div>
</body>
</html>
